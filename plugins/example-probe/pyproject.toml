[project]
name = "vharness-example-probe"
version = "0.1.0"
description = "Reference probe plugin for Vharness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["vharness>=0.2,<0.3"]

[project.entry-points."vharness.plugins"]
example_probe = "vharness_example_probe.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/vharness_example_probe"]
