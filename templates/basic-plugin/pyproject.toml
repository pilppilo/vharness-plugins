[project]
name = "vharness-plugin-example"
version = "0.1.0"
description = "Example Vharness plugin"
requires-python = ">=3.10"
dependencies = ["vharness>=0.2,<0.3"]

[project.entry-points."vharness.plugins"]
example = "vharness_plugin_example.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/vharness_plugin_example"]
